{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper glass-card">
    <!-- Active state navigation links -->
    <div class="auth-tabs">
        <a href="{{ url_for('login') }}" class="auth-tab {% if active_tab == 'login' %}active{% endif %}">
            Sign In
        </a>
        <a href="{{ url_for('register') }}" class="auth-tab {% if active_tab == 'register' %}active{% endif %}">
            Register
        </a>
    </div>

    {% if active_tab == 'login' %}
        <!-- Sign In Form -->
        <form action="{{ url_for('login') }}" method="POST">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Welcome back!</h2>
            <div class="form-group">
                <label for="login-username" class="form-label">Username</label>
                <input type="text" id="login-username" name="username" class="form-control" placeholder="e.g. user" required autofocus>
            </div>
            <div class="form-group">
                <label for="login-password" class="form-label">Password</label>
                <input type="password" id="login-password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                Let's Play
            </button>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Default credentials: <br>
                Admin: <code style="color: var(--warning);">admin / admin123</code> <br>
                Standard: <code style="color: var(--accent);">user / user123</code>
            </p>
        </form>
    {% else %}
        <!-- Registration Form -->
        <form action="{{ url_for('register') }}" method="POST">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h2>
            <div class="form-group">
                <label for="register-username" class="form-label">Username</label>
                <input type="text" id="register-username" name="username" class="form-control" placeholder="Select unique username" required>
            </div>
            <div class="form-group">
                <label for="register-password" class="form-label">Password</label>
                <input type="password" id="register-password" name="password" class="form-control" placeholder="At least 6 characters" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                Register Account
            </button>
        </form>
    {% endif %}
</div>
{% endblock %}
