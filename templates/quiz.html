{% extends "base.html" %}

{% block content %}
<div class="glass-card">
    <!-- Active Quiz Session Header -->
    <div class="quiz-header">
        <div>
            <h4 style="color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.2rem; font-size: 0.85rem;">
                Category: {{ category_name }}
            </h4>
            <h2 style="margin: 0; font-size: 1.6rem;">
                Question <span id="question-num">0</span> of <span id="total-questions">0</span>
            </h2>
        </div>
        
        <!-- Timer Badge -->
        <div id="timer-box" class="timer-box">
            ⏱️ <span id="timer-text">15.0s</span>
        </div>
    </div>

    <!-- Question Loading progress bar -->
    <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- Active dynamic injection division container -->
    <div id="quiz-area" data-category-id="{{ category_id }}">
        <div style="text-align: center; padding: 3rem;">
            <p>Initializing quiz content...</p>
        </div>
    </div>
</div>

<!-- Incorporate AJAX handler script -->
<script src="{{ url_for('static', filename='quiz.js') }}"></script>
{% endblock %}
